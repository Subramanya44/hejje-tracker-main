<ion-content>
  <div class="ion-card">
    <ion-card-header>
      <span class="circle-icon">
        <ion-icon name="navigate-outline"></ion-icon>
      </span>
      <h1>{{ 'LANDMARK_MANAGEMENT.ADD_LANDMARK'| translate }}</h1>
    </ion-card-header>
    <form [formGroup]="addLandmarksForm" (ngSubmit)="onSubmit()">
        

<!--      <div class="form-group">-->
<!--        <label for="track_date">{{ 'ADD_TRACK_PAGE.TRACK_DATE' | translate }}</label>-->
<!--        <ion-datetime display-format="DD MMM YYYY" formControlName="track_date" class="form-control"></ion-datetime>-->
<!--      </div>-->


      
      <div class="form-group">
        <label for="name">{{ 'LANDMARK_MANAGEMENT.NAME' | translate }}</label>
        <ion-input type="text" id="name" formControlName="name" class="form-control"
          fill="outline"></ion-input>
      </div>
      
      <div class="form-group">
        <label for="description">{{ 'LANDMARK_MANAGEMENT.DESCRIPTION' | translate }}</label>
        <ion-input type="text" id="description" formControlName="description" class="form-control" fill="outline"></ion-input>
      </div>
      <div class="form-group">
        <label for="latitude">{{ 'LANDMARK_MANAGEMENT.LATITUDE' | translate }}</label>
        <ion-input type="number" id="latitude" formControlName="latitude" class="form-control" fill="outline"></ion-input>
      </div>

      <div class="form-group">
        <label for="longitude">{{ 'LANDMARK_MANAGEMENT.LONGITUDE' | translate }}</label>
        <ion-input type="number" id="longitude" formControlName="longitude" class="form-control" fill="outline"></ion-input>
      </div>
    
      <ion-item>
        <ion-label>{{ 'LANDMARK_MANAGEMENT.STATUS' | translate }}</ion-label>
        <ion-toggle formControlName="status" slot="end"></ion-toggle>
      </ion-item>
      <ion-button expand="block" type="submit" [disabled]="addLandmarksForm.invalid">{{ 'ADD_TRACK_PAGE.SUBMIT' | translate }}
      </ion-button>
    </form>
  </div>
</ion-content>
