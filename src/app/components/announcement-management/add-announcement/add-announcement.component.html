<ion-content>
  <div class="ion-card">
    <ion-card-header>
      <ion-icon name="arrow-back" class="back-button" (click)="goBack()"></ion-icon>
      <span class="circle-icon">
        <ion-icon name="navigate-outline"></ion-icon>
      </span>
      <h1>{{ pageTitle }}</h1>
    </ion-card-header>

    <form [formGroup]="addAnnouncementForm" (ngSubmit)="onSubmit()">

      <!-- Complaint Details -->
      <div class="form-group">
        <label class="complaint-label">Complaint Details</label>
      </div>

      <!-- Complaint ID & Complaint Name Fields -->
      <div class="complaint-container">
        <!-- Complaint ID Field -->
        <div class="form-group half-width">
          <label for="complaint_id">Complaint ID</label>
          <ion-select id="complaint_id" formControlName="complaint_id" class="form-control" fill="outline"
            multiple="true">
            <ion-select-option *ngFor="let complaint of complaintsList" [value]="complaint.id">
              <ion-checkbox slot="start"></ion-checkbox> {{ complaint.id }}
            </ion-select-option>
          </ion-select>
        </div>

        <!-- Complaint Name Field -->
        <div class="form-group half-width">
          <label for="complaint_name">Complaint Name</label>
          <ion-select id="complaint_name" formControlName="complaint_name" class="form-control" fill="outline"
            multiple="true">
            <ion-select-option *ngFor="let complaint of complaintsList" [value]="complaint.name">
              <ion-checkbox slot="start"></ion-checkbox> {{ complaint.name }}
            </ion-select-option>
          </ion-select>
        </div>
      </div>

      <div class="form-group">
        <div class="form-group-radio form-group-inline">
          <ion-input id="announcement_date" label="{{ 'Add_ANNOUNCEMENT.DATE_TIME' | translate }}"
            formControlName="announcement_date" type="date" class="form-control" fill="outline">
          </ion-input>

          <ion-button fill="clear" color="primary" (click)="addTimeField()" [disabled]="timeFieldsArray.length >= 2">
            <ion-icon name="add-circle-outline"></ion-icon>
          </ion-button>
        </div>
      </div>

      <!-- Dynamic Time Fields -->
      <div class="form-group" formArrayName="timeFieldsArray">
        <div *ngFor="let control of timeFieldsArray.controls; let i = index" class="time-picker-container">
          <label>{{ 'Add_ANNOUNCEMENT.TIME' | translate }} {{ i + 1 }}</label>
          <ion-input type="time" [formControlName]="i" class="form-control"></ion-input>
          <ion-button fill="clear" color="danger" (click)="removeTimeField(i)">
            <ion-icon name="trash-outline"></ion-icon>
          </ion-button>
        </div>
      </div>

      <div (click)="getCurrentLocation()" class="location-button">
        <ion-icon name="location"></ion-icon>
        <p>{{ 'GET_CURRENT_LOCATION' | translate }}</p>
      </div>
      <div class="form-group">
        <label for="location">{{ 'ADD_TRACK_PAGE.LOCATION' | translate }}</label>

        <ion-input fill="outline" class="form-control" id="location" formControlName="location" (blur)="onInputBlur()"
          (focus)="onInputFocus()" (ionInput)="onInputChange($event)">
        </ion-input>


      </div>

      <div class="form-group-count">
        <div class="form-group w-full">
          <label for="latitude">{{ 'ADD_TRACK_PAGE.LATITUDE' | translate }}</label>
          <ion-input type="number" id="latitude" formControlName="latitude" class="form-control"
            fill="outline"></ion-input>
        </div>
        <div class="form-group w-full">
          <label for="longitude">{{ 'ADD_TRACK_PAGE.LONGITUDE' | translate }}</label>
          <ion-input type="number" id="longitude" formControlName="longitude" class="form-control"
            fill="outline"></ion-input>
        </div>
      </div>

      <!-- Circle Name Field -->
      <div class="form-group">
        <label for="circle_name">{{ 'ELEPHANT_MANAGEMENT.CIRCLE_NAME' | translate }}</label>
        <ion-select id="circle_name" formControlName="circle_name" class="form-control" fill="outline"
          interface="popover">
          <ion-select-option *ngFor="let name of circle_name" [value]="name.value">
            {{ name.label }}
          </ion-select-option>
        </ion-select>
      </div>

      <!-- Division Name Field -->
      <div class="form-group">
        <label for="division_name">{{ 'ELEPHANT_MANAGEMENT.DIVISION_NAME' | translate }}</label>
        <ion-select id="division_name" formControlName="division_name" class="form-control" fill="outline"
          interface="popover">
          <ion-select-option *ngFor="let name of division_name" [value]="name.value">
            {{ name.label }}
          </ion-select-option>
        </ion-select>
      </div>

      <!-- Range Name Field -->
      <div class="form-group">
        <label for="range_name">{{ 'Add_ANNOUNCEMENT.RANGE_NAME' | translate }}</label>
        <ion-select id="range_name" formControlName="range_name" class="form-control" fill="outline" multiple="true"
          interface="popover">
          <ion-select-option *ngFor="let name of range_name" [value]="name.value">
            <ion-checkbox slot="start" [checked]="isSelected('range_name', name.value)"></ion-checkbox>
            {{ name.label }}
          </ion-select-option>
        </ion-select>
      </div>

      <!-- Section Name Field -->
      <div class="form-group">
        <label for="section_name">{{ 'Add_ANNOUNCEMENT.SECTION_NAME' | translate }}</label>
        <ion-select id="section_name" formControlName="section_name" class="form-control" fill="outline" multiple="true"
          interface="popover">
          <ion-select-option *ngFor="let name of section_name" [value]="name.value">
            <ion-checkbox slot="start" [checked]="isSelected('section_name', name.value)"></ion-checkbox>
            {{ name.label }}
          </ion-select-option>
        </ion-select>
      </div>

      <!-- Village Name Field -->
      <div class="form-group">
        <label for="village_name">{{ 'Add_ANNOUNCEMENT.VILLAGE_NAME' | translate }}</label>
        <ion-select id="village_name" formControlName="village_name" class="form-control" fill="outline" multiple="true"
          interface="popover">
          <ion-select-option *ngFor="let name of village_name" [value]="name.value">
            <ion-checkbox slot="start" [checked]="isSelected('village_name', name.value)"></ion-checkbox>
            {{ name.label }}
          </ion-select-option>
        </ion-select>
      </div>

      <div class="displaybutton">
        <ion-button fill="outline" color="danger" (click)="cancel()">
          <strong>Cancel <ion-icon slot="end" name="close"></ion-icon> </strong>
        </ion-button>
        <ion-button expand="block" type="submit" [disabled]="addAnnouncementForm.invalid">
          {{ submitButtonText | translate }}
        </ion-button>
      </div>
    </form>
  </div>
</ion-content>
